[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nachtkarte-pipeline"
version = "0.1.0"
description = "Event scraping pipeline for NachtKarte Berlin"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    "playwright>=1.44.0",
    "supabase>=2.5.0",
    "anthropic>=0.28.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "python-dateutil>=2.9.0",
    "tenacity>=8.3.0",
    "apify-client>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["scrapers", "pipeline", "db"]
