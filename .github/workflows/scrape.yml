name: Daily Scrape

# Unscheduled on purpose. The nightly scrape runs on Hetzner now
# (deploy/run-scrape.sh, cron at 02:00 UTC) because this job had a 120-minute
# cap that cancelled 7 of 8 runs, and because Actions minutes on a private repo
# ran out on 17 August and stopped the catalogue for four days.
#
# The schedule is removed rather than the workflow, so this stays available as
# a manual fallback if the box dies. Restoring the `schedule:` block below is
# the rollback — but only after stopping the Hetzner cron, never both at once:
# two runs at 02:00 UTC would compete for the same rows.
#
#   schedule:
#     - cron: "0 2 * * *"
#
# Timing matters: the Actions allowance resets on 1 September, and a schedule
# left in place would silently start a second nightly scrape that day.
on:
  workflow_dispatch: # manual fallback only

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}     # generic_website + instagram scrapers
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}   # embed-at-ingest + categorizer (default gateway)
  EVENTBRITE_API_KEY: ${{ secrets.EVENTBRITE_API_KEY }}
  MEETUP_API_KEY: ${{ secrets.MEETUP_API_KEY }}
  LOG_LEVEL: INFO

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e .

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      # Persist the generic scraper's content-hash cache between runs so
      # unchanged venue pages skip LLM extraction
      - name: Restore scrape cache
        uses: actions/cache@v4
        with:
          path: data/scrape_cache.json
          key: scrape-cache-${{ github.run_id }}
          restore-keys: scrape-cache-

      - name: Run all scrapers
        run: python main.py --run-all

      # Maintenance: normalize taxonomy strays, deactivate past events
      - name: Run DB cleanup
        if: always()
        run: python scripts/db_cleanup.py
